# Aethera Reports — shared server mode (Phase 3 chunk E).
#
# Not brought up as part of this change — authoring only. To actually run
# it (from the repo root, so the build context includes src/ and server/):
#
#   docker compose -f server/docker-compose.yml build
#   docker compose -f server/docker-compose.yml up -d
#   docker compose -f server/docker-compose.yml exec aethera-reports-server \
#     npx vite-node server/src/cli.ts -- user add <username> <password>
#
# See docs/server-mode.md for the full walkthrough, including the
# LAN/Tailscale binding patterns referenced below.

services:
  aethera-reports-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: aethera-reports-server
    restart: unless-stopped
    environment:
      AETHERA_SERVER_HOST: 0.0.0.0 # bind inside the container; the HOST-side exposure is controlled by the "ports" mapping below, not this.
      AETHERA_SERVER_PORT: '8787'
      # AETHERA_SERVER_JWT_SECRET: set this explicitly for a reproducible
      # secret across container recreates (otherwise one is generated on
      # first run and persisted to the volume below, which is also fine
      # as long as the volume itself persists).
    ports:
      # Default: only reachable from this host (matches the app's own
      # "bind host/port (default 127.0.0.1)" default). Two documented
      # ways to open this up to other staff machines — pick ONE:
      #
      #   LAN, this host's normal IP (e.g. 192.168.1.20):
      #     - '192.168.1.20:8787:8787'
      #
      #   Tailscale (recommended — no firewall/router changes, already
      #   encrypted): bind to this host's Tailscale IP (`tailscale ip -4`)
      #   the same way, e.g.:
      #     - '100.x.y.z:8787:8787'
      #
      # Never map to '0.0.0.0:8787:8787' (all interfaces) on a machine
      # with a public IP unless it sits behind its own reverse proxy/TLS
      # and firewall — this server's HTTP is plain, unencrypted HTTP.
      - '127.0.0.1:8787:8787'
    volumes:
      - aethera-reports-server-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  aethera-reports-server-data:
