appId: com.aethera.reports
productName: Aethera Reports
copyright: Copyright © Aethera Healthcare

directories:
  buildResources: build

files:
  - '!**/.vscode/*'
  - '!src/*'
  # vite/vite-node are runtime deps only for the server/ app (vite-node
  # executes ?raw SQL imports there); the desktop bundles in out/ never
  # require them, so keep the toolchain out of the installer.
  - '!node_modules/vite/**'
  - '!node_modules/vite-node/**'
  - '!node_modules/esbuild/**'
  - '!node_modules/@esbuild/**'
  - '!node_modules/rollup/**'
  - '!node_modules/@rollup/**'
  - '!server/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{test,sample-data,docs,scripts,.github}/**'
  - '!*.duckdb'
  - '!*.sqlite'

# @duckdb/node-api and better-sqlite3 ship compiled native addons (.node
# files) that cannot live inside the asar archive — Node/Electron cannot
# dlopen a binary from inside an asar. Unpack both to the filesystem.
asarUnpack:
  - '**/node_modules/@duckdb/**'
  - '**/node_modules/better-sqlite3/**'

# Rebuild native modules against the pinned Electron ABI before packaging.
# Both native deps are N-API-based and are ABI-stable across recent
# Node/Electron versions, but rebuilding is a cheap correctness guarantee.
npmRebuild: true

win:
  executableName: Aethera Reports
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
  # --- Code signing (TODO, tracked as Risk 6 fast-follow) ---
  # Unsigned installers trigger Windows SmartScreen warnings; accepted for
  # v1 (see README + release notes for the "Run anyway" workaround and
  # published checksums). Wiring a certificate is config-only once one is
  # available:
  #   signingHashAlgorithms: ['sha256']
  #   certificateFile: build/cert.pfx          # or use CSC_LINK
  #   certificatePassword: ${env.WIN_CSC_LINK_PASSWORD}
  # electron-builder also reads CSC_LINK / CSC_KEY_PASSWORD env vars
  # directly (set as GitHub Actions secrets) without any YAML changes.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

msi:
  artifactName: ${name}-${version}.${ext}
  upgradeCode: 6b6f5f3a-1c8e-4c9e-9a3e-3a2f6b7a2e10

linux:
  target:
    - AppImage
  category: Office

publish:
  provider: github
  owner: kk078
  repo: aethera-reports
